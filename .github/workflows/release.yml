name: Release

# On every push to main, Changesets either:
#  - opens or updates the "Release packages" PR (when changesets are pending), or
#  - publishes @uploadcn/* to npm (when that PR is merged and versions changed).
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in this
# repository. Each package on npmjs.com trusts this file (release.yml) in
# uploadcn/uploadcn, and every release gets a provenance attestation.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: release
    if: github.repository == 'uploadcn/uploadcn'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # v2 understands Changesets v3 output, so it tags and creates GitHub
      # releases for what was published.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: release packages"
          commit-message: "chore: release packages"
        env:
          NPM_CONFIG_PROVENANCE: true
