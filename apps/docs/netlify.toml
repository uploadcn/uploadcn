# Older shadcn style names get the default (Nova) build.

[[redirects]]
  from = "/r/new-york-v4/*"
  to = "/r/:splat"
  status = 200

[[redirects]]
  from = "/r/new-york/*"
  to = "/r/:splat"
  status = 200

[[redirects]]
  from = "/r/default/*"
  to = "/r/:splat"
  status = 200


# The shadcn CLI fetches registry items from any origin.
[[headers]]
  for = "/r/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# Search index: built per deploy, downloaded once by the command menu.
[[headers]]
  for = "/api/search"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Open Graph images and icons rarely change; let browsers and crawlers cache.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/icon-*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
