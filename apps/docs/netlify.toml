# Netlify settings for the UploadCN docs (a Next.js app in a pnpm/Turborepo
# monorepo). In the Netlify UI: leave "Base directory" empty (repo root) and
# set "Package directory" to apps/docs. Paths here are relative to the repo
# root. Next.js itself is handled by Netlify's OpenNext adapter (zero config).

[build]
  command = "pnpm turbo run build --filter=docs"
  publish = "apps/docs/.next"
  # Skip the build (and its 15 credits) when nothing the docs depend on
  # changed: docs content, its packages or the lockfile.
  ignore = "npx turbo-ignore docs --fallback=HEAD^1"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  TURBO_TELEMETRY_DISABLED = "1"

# Style-aware registry URLs: the shadcn CLI requests /r/{base}-{style}/x.json.
# Netlify can't serve these through the Next.js rewrites in next.config.mjs
# (they point at static files), so the CDN rewrites them directly. Status
# 200 keeps the URL, and no server function runs.

[[redirects]]
  from = "/r/base-vega/*"
  to = "/r/styles/vega/:splat"
  status = 200

